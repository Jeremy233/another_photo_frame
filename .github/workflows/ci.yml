name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        name: Find every Package.swift under Packages/, Tools/ and Apps/
        run: |
          packages=$( { find Packages Tools -mindepth 2 -maxdepth 2 -name Package.swift; \
                        find Apps -mindepth 3 -maxdepth 3 -name Package.swift; } \
            | xargs -n1 dirname | sort | jq -R . | jq -cs .)
          echo "Found: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: swift test (${{ matrix.package }})
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    # macOS 26 on Apple Silicon. Keep this and DEVELOPER_DIR in sync with the README.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test

  app:
    name: Build macOS app
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Build Apps/PhotoFrameMac
        # 本地签名（D-20：Alpha 不签名）；CI 上不签名。
        run: |
          xcodebuild -project Apps/PhotoFrameMac/PhotoFrameMac.xcodeproj -scheme PhotoFrameMac \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
